name: Security checks

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install ruff==0.17.2 bandit==1.9.4 pip-audit==2.10.1

      - name: Ruff
        run: ruff check server.py oauth.py connect_api_dc_sql.py connect_api_datacloud.py

      - name: Bandit
        run: bandit -q -c pyproject.toml -ll -ii server.py oauth.py connect_api_dc_sql.py connect_api_datacloud.py

      - name: Dependency audit
        run: pip-audit -r requirements.lock

      - name: Tool definition pin
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/bin/sf"
          chmod +x "$HOME/bin/sf"
          PATH="$HOME/bin:$PATH" python -c "import server; server.verify_tool_definitions()"

      - name: Secret scan of git history
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect --source . --redact --exit-code 1 --log-opts="--all"
